# Bridge from MKRF species-share buckets to published VLM market species rows.
# Every bridge assumption is explicit rather than silently averaged.
#
#   Cw  -> Cedar   western redcedar
#   Fd  -> Fir     coastal Douglas-fir
#   Hw  -> Hembal  western hemlock; "Hembal" is the published hemlock/balsam pool
#   Ba  -> Hembal  amabilis fir (balsam) is priced in the same Hembal pool
#   Yc  -> Cedar   the second-growth report publishes no Cypress row, so yellow
#                  cedar is proxied to Cedar
#   Dr  -> null    red alder is a hardwood with no coast conifer log price
#   Dec -> null    deciduous bucket, same reason
#   Oth -> null    unresolved residual bucket is deliberately unpriced
species_market_proxies:
  share_ba: Hembal
  share_cw: Cedar
  share_dec: null
  share_dr: null
  share_fd: Fir
  share_hw: Hembal
  share_oth: null
  share_yc: Cedar
