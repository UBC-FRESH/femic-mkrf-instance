# MKRF log grade price matrix.
#
# Context: Malcolm Knapp Research Forest is located at Maple Ridge in the BC
# Lower Mainland. That is Coast Forest Region, and coastal logs from this area
# are sold into the Vancouver Log Market (VLM). The governing published price
# series is therefore the Coast Selling Price System log market report, not any
# Interior series.
#
# Source
#   Coast Selling Price System - Average Log Prices - Second Growth
#   For the 3 month period ending: January 2026
#   Prepared by Timber Pricing Branch, BC Ministry of Forests
#   https://www2.gov.bc.ca/assets/gov/farming-natural-resources-and-industry/forestry/timber-pricing/coast-timber-pricing/coast-log-reports/3m2gc_jan_26.pdf
#   Index page:
#   https://www2.gov.bc.ca/gov/content/industry/forestry/competitive-forest-industry/timber-pricing/coast-timber-pricing/coast-log-market-reports
#
# Why second growth: the MKRF managed lane is planted/second-growth origin, and
# the shipped FEMIC recipe selector maps planted origin to the second-growth
# coast matrix. The old-growth VLM series is the counterpart for natural-origin
# harvest and is not applied to the managed products here.
#
# Why the 3-month series: the three-month rolling report smooths single-month
# market volatility, which is the appropriate basis for strategic planning
# horizons rather than a one-month spot snapshot.
#
# Units: CAD per cubic metre (AMV = average market value).
#
# Extraction method: the published PDF leaves unpriced cells blank, so flat text
# extraction shifts values into the wrong species column. Values below were
# resolved positionally, matching each numeric cell's horizontal centre against
# the species header column centres, and cross-checked against the previously
# shipped December 2025 matrix.
#
# Verified species coverage for this reporting period: only Cedar, Fir, Hembal,
# Spruce and Pine carry any published second-growth prices. There are no Alder,
# Birch, Cottonwood, Cypress or Maple prices in this report. That is why the
# deciduous buckets are left unpriced and why yellow cedar is proxied to Cedar
# rather than to a Cypress row. Pine is published (grade J only) but MKRF has no
# pine species bucket, so it is not carried.
#
# Grade F is held at 0.0 and grade D, though published for Cedar, is inert:
# TIPSY/BTC cannot produce D or F logs because those grades require 50% and 25%
# clear lumber respectively and TIPSY does not model pruning (see TIPSY 4.5
# help, "Coastal Log Grades"). The Cedar D price is carried for faithfulness to
# the source, but multiplies a volume that is always zero.

