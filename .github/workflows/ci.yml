name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ws4-patch-first:
    name: ws4 patch-first schedule contract
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pandas pyarrow numpy

      - name: Verify the offset schedule contract
        run: python -m pytest tests/test_ws4_patch_schedule.py -q
